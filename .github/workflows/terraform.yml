name: Terraform Plan and Apply

on:
  push: 
     branches:
     - practice/dev-eks
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run terraform on'
        required: true
        default: 'main'
      action:
        description: 'Choose whether to run plan or apply'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: 'plan'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'us-east-1'  # Change to your desired region

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan (Run only if selected in dispatch)
      if: ${{ github.event.inputs.action == 'plan' }}
      run: terraform plan 

    - name: Terraform Apply (Run only if selected in dispatch)
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        terraform plan
        terraform apply -auto-approve 

    - name: Terraform destroy (Run only if selected in dispatch)
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -auto-approve   

